document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Mallow enclosure — rev D<\u002Ftitle>\n<script type=\"importmap\">\n{\n  \"imports\": {\n    \"three\": \"https://unpkg.com/three@0.184.0/build/three.module.js\",\n    \"three/addons/controls/OrbitControls.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\",\n    \"three/addons/exporters/OBJExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\",\n    \"three/addons/exporters/GLTFExporter.js\": \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\"\n  },\n  \"integrity\": {\n    \"https://unpkg.com/three@0.184.0/build/three.module.js\": \"sha384-8FCZ1eVO6it4+pbec2aDtnTrwjWXZLJRC+MAGCIPDgsYnUrl/E0A2YlF8ioMKI/J\",\n    \"https://unpkg.com/three@0.184.0/build/three.core.js\": \"sha384-dw2ooPewaEIrAgl6oFDBmmBWCE9oW9LxRGcfwZ0hLvEprzo202wXl7vCYHRlSnOT\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/controls/OrbitControls.js\": \"sha384-4rziNxOBZKQ69i+w+f89KJ55TCYquwchVbByQwmaOeIOXdOU2PLDn3kOfXHwIJC9\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/OBJExporter.js\": \"sha384-nbwtoZENJD3Vq+ACK0CuGQdPMuDWHkamC2KJD70EV5nfg6jQjfppKOea07YJN+N3\",\n    \"https://unpkg.com/three@0.184.0/examples/jsm/exporters/GLTFExporter.js\": \"sha384-VofkvpG6HERhFCYbsUOHeNXBCqID2nfqkQqnVzE1jc/oPcz+qJ13ADdXH08hE+cQ\"\n  }\n}\n<\u002Fscript>\n<style>\n  html,body{margin:0;height:100%;background:#eeebe5;font-family:ui-sans-serif,system-ui,\"Helvetica Neue\",sans-serif}\n  three-d-stage:not(:defined){visibility:hidden}\n  three-d-stage{display:block;width:100vw;height:100vh}\n  .legend{position:fixed;left:20px;top:20px;z-index:5;font-size:12px;line-height:1.55;color:#3a4048;\n          background:rgba(255,255,255,.85);border:1px solid #ddd7cc;border-radius:4px;padding:12px 14px;max-width:262px;\n          max-height:calc(100vh - 40px);overflow:auto}\n  .legend h1{margin:0 0 6px;font-size:13px;font-weight:650}\n  .legend p{margin:0 0 4px;color:#6a7079}\n  .legend b{font-weight:600;color:#3a4048}\n  .parts{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}\n  .parts button{font:inherit;font-size:11px;padding:4px 8px;border:1px solid #c9c2b4;border-radius:3px;\n                background:#fff;color:#3a4048;cursor:pointer;white-space:nowrap}\n  .parts button:hover{border-color:#8a8577}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<div class=\"legend\">\n  <h1>Mallow enclosure — rev D<\u002Fh1>\n  <p><b>119 × 78 × 38 mm<\u002Fb>, 2.5 mm walls, 6.5 mm corner radius, square bottom edge.<\u002Fp>\n  <p><b>Rear openings come from Figure 4 of the datasheet<\u002Fb> — connector centres 14.20 / 31.60 / 48.99 / 65.79 / 85.29 mm from the board's left edge, widths 15.74 / 14.30 / 8.92 / 15.00 / 17.30, each with 0.6 mm clearance.<\u002Fp>\n  <p>The rear panel is <b>1.5 mm thick and unbroken<\u002Fb>, so the PCB edge and the bottom-side parts stay hidden. Its outer face sits level with the USB-C: RJ45 and power stand 0.7 mm proud, HDMI sits 0.8 mm in, USB-A 1.8 mm in.<\u002Fp>\n  <p><b>Four solid corner posts<\u002Fb> live in the 7 mm side gaps, clear of the board. Each takes an M3 from the base plate and carries a 5 × 2 mm magnet flush with the wall top, meeting its pair in the cover.<\u002Fp>\n  <p>Board drops straight down onto <b>four standoffs on the base plate<\u002Fb> at its own Ø3.2 holes — M3 from above, rear pair Ø6 to clear the panel.<\u002Fp>\n  <p>Base plate: counterbored screw holes and four Ø10.4 pockets for 10 × 2 mm mounting magnets. M3 pilot bores are Ø2.8.<\u002Fp>\n  <p><b>Front face, from Figure 4:<\u002Fb> two Ø4 switch windows and two Ø2 LED windows at 9 / 14 / 18 / 23 mm from the board's right edge. Standoffs stay at 10 mm — Figure 7 gives 8.52 mm of bottom-side height.<\u002Fp>\n  <p>Green board and heatsink are <b>reference only<\u002Fb> — delete after import.<\u002Fp>\n  <div class=\"parts\">\n    <button data-part=\"all\">Whole assembly<\u002Fbutton>\n    <button data-part=\"base\">Base plate<\u002Fbutton>\n    <button data-part=\"shell\">Shell<\u002Fbutton>\n    <button data-part=\"cap\">Top cover<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"parts\"><button id=\"explode\">Explode<\u002Fbutton><button id=\"frontface\">Blank front<\u002Fbutton><\u002Fdiv>\n  <p style=\"margin-top:8px\">Pick a part, then Download OBJ/GLB for that part alone. Screws and magnets are hardware.<\u002Fp>\n<\u002Fdiv>\n<three-d-stage name=\"mallow-enclosure\" background=\"#eeebe5\"><\u002Fthree-d-stage>\n<script src=\"99d93d96-1894-4db6-b424-f3b04574cfbf\"><\u002Fscript>\n<script type=\"module\">\nconst stage = document.querySelector('three-d-stage');\nconst { THREE } = await stage.ready;\nconst mm = v => v / 1000;\n\n/* ---- board, from the Mallow V1.1 datasheet section 4.1 ---- */\nconst PCB_W = mm(100), PCB_D = mm(72), PCB_T = mm(1.6);\nconst HX = mm(47), HZ = mm(33);                 // Ø3.2 mounting holes, 3 mm inset\n\n/* ---- shell ---- */\nconst W = mm(119), D = mm(78), R = mm(6.5), T = mm(2.5), TR = mm(1.5);\nconst FLOOR = mm(2.5), STANDOFF = mm(10);\nconst BZ = mm(1.2);                             // board 0.3 mm off the rear panel's inner face\nconst PCB_Y = FLOOR + STANDOFF, PCB_TOP = PCB_Y + PCB_T;\nconst REAR_Y = mm(10);\nconst WALL_TOP = mm(32), SLOT = mm(3.5), TOP_T = mm(2.5);\nconst TOP_Y = WALL_TOP + SLOT;                  // underside of the floating cover — 38 mm overall\nconst GAP = mm(51);                             // half-width of the rear cut-away\nconst PX = mm(54.75), PZ = mm(32);              // corner posts, in the 7 mm side gaps\nconst MAG_R = mm(2.6), MAG_H = mm(2);           // 5 × 2 mm neodymium disc\nconst CORNERS = [[-1, -1], [1, -1], [-1, 1], [1, 1]];\nconst IX = W / 2 - T, IZ = D / 2 - T;           // inner faces\nconst CX = IX - (R - T), CZ = IZ - (R - T);     // corner arc centres\n\nconst mats = {\n  shell: new THREE.MeshStandardMaterial({ name: 'petg_black',   color: 0x2b2e33, roughness: 0.55, metalness: 0.06 }),\n  base:  new THREE.MeshStandardMaterial({ name: 'petg_black_2', color: 0x22252a, roughness: 0.62, metalness: 0.06 }),\n  cover: new THREE.MeshStandardMaterial({ name: 'petg_black_3', color: 0x33373d, roughness: 0.50, metalness: 0.06 }),\n  pcb:   new THREE.MeshStandardMaterial({ name: 'pcb_green',    color: 0x1f5e3a, roughness: 0.55, metalness: 0.10 }),\n  metal: new THREE.MeshStandardMaterial({ name: 'heatsink',     color: 0xb2b6ba, roughness: 0.38, metalness: 0.35 }),\n  mag:   new THREE.MeshStandardMaterial({ name: 'magnet',       color: 0x9aa0a6, roughness: 0.30, metalness: 0.60 })\n};\n\nconst root = new THREE.Group(); root.name = 'mallow_enclosure';\nconst body = new THREE.Group(); body.name = 'enclosure';\nconst ref  = new THREE.Group(); ref.name = 'reference_board_do_not_print';\nroot.add(body, ref);\n\nfunction box(parent, name, mat, w, h, d, x, y, z) {\n  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);\n  m.name = name; m.position.set(x, y + h / 2, z); parent.add(m); return m;\n}\nfunction prism(parent, name, mat, shape, h, y, holes = []) {\n  holes.forEach(p => shape.holes.push(p));\n  const g = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false, curveSegments: 24 });\n  g.rotateX(-Math.PI / 2);\n  const m = new THREE.Mesh(g, mat);\n  m.name = name; m.position.y = y; parent.add(m); return m;\n}\nfunction ring(ro, ri) {\n  const s = new THREE.Shape(); s.absarc(0, 0, ro, 0, Math.PI * 2, false);\n  const h = new THREE.Path(); h.absarc(0, 0, ri, 0, Math.PI * 2, true);\n  s.holes.push(h); return s;\n}\n/* rounded rectangle, traced clockwise in shape space (shape y = −world z) */\nfunction rrOutline(target, w, d, r, ox = 0, oy = 0) {\n  const x = w / 2 + ox, y = d / 2 + oy, nx = -w / 2 + ox, ny = -d / 2 + oy;\n  target.moveTo(nx + r, ny);\n  target.lineTo(x - r, ny); target.quadraticCurveTo(x, ny, x, ny + r);\n  target.lineTo(x, y - r);  target.quadraticCurveTo(x, y, x - r, y);\n  target.lineTo(nx + r, y); target.quadraticCurveTo(nx, y, nx, y - r);\n  target.lineTo(nx, ny + r);target.quadraticCurveTo(nx, ny, nx + r, ny);\n  target.closePath(); return target;\n}\nconst rrShape = (w, d, r) => rrOutline(new THREE.Shape(), w, d, r);\nconst rrPath  = (w, d, r, ox = 0, oy = 0) => rrOutline(new THREE.Path(), w, d, r, ox, oy);\n\n/* one side piece per side, each carrying two corners; ends at x = ±GAP on both faces */\nfunction sidePiece(S) {\n  const x = W / 2, y = D / 2, xi = IX, yi = IZ, r = R, ri = R - T;\n  const s = new THREE.Shape();\n  s.moveTo(S * GAP, -y);\n  s.lineTo(S * (x - r), -y); s.quadraticCurveTo(S * x, -y, S * x, -y + r);\n  s.lineTo(S * x, y - r);    s.quadraticCurveTo(S * x, y, S * (x - r), y);\n  s.lineTo(S * GAP, y);\n  s.lineTo(S * GAP, yi);\n  s.lineTo(S * (xi - ri), yi); s.quadraticCurveTo(S * xi, yi, S * xi, yi - ri);\n  s.lineTo(S * xi, -yi + ri);  s.quadraticCurveTo(S * xi, -yi, S * (xi - ri), -yi);\n  s.lineTo(S * GAP, -yi);\n  s.closePath(); return s;\n}\n\n/* ---- shell: two side pieces, a 2.5 mm front plate, a 1.5 mm rear panel ---- */\nprism(body, 'wall_side_right', mats.shell, sidePiece(1),  WALL_TOP - FLOOR, FLOOR);\nprism(body, 'wall_side_left',  mats.shell, sidePiece(-1), WALL_TOP - FLOOR, FLOOR);\n\n/* front face: two Ø4 switch windows and two Ø2 LED windows. Figure 4 puts them on\n   the front edge at 9 / 14 / 18 / 23 mm from the board's right edge; Figure 7 gives\n   the switches 3.3 mm tall and the LEDs 1.7 mm above the PCB */\nconst front = new THREE.Shape();\nfront.moveTo(-GAP, FLOOR); front.lineTo(GAP, FLOOR);\nfront.lineTo(GAP, WALL_TOP); front.lineTo(-GAP, WALL_TOP); front.closePath();\nconst hole = (x, y, r) => { const p = new THREE.Path(); p.absarc(x, y, r, 0, Math.PI * 2, true); return p; };\n[mm(-41), mm(-27)].forEach(x => front.holes.push(hole(x, PCB_TOP + mm(1.65), mm(2))));\n[mm(-36), mm(-32)].forEach(x => front.holes.push(hole(x, PCB_TOP + mm(0.85), mm(1))));\nconst fm = new THREE.Mesh(\n  new THREE.ExtrudeGeometry(front, { depth: T, bevelEnabled: false, curveSegments: 24 }), mats.shell);\nfm.name = 'wall_front'; fm.position.z = -D / 2; body.add(fm);\n\n/* same plate with no windows, for the blank-front variant */\nconst blank = new THREE.Shape();\nblank.moveTo(-GAP, FLOOR); blank.lineTo(GAP, FLOOR);\nblank.lineTo(GAP, WALL_TOP); blank.lineTo(-GAP, WALL_TOP); blank.closePath();\nconst bm = new THREE.Mesh(\n  new THREE.ExtrudeGeometry(blank, { depth: T, bevelEnabled: false, curveSegments: 4 }), mats.shell);\nbm.name = 'wall_front_blank'; bm.position.z = -D / 2; bm.visible = false; body.add(bm);\n\nconst CL = mm(0.6);\nconst ports = [\n  { name: 'power_x5',     c: mm(-35.29), w: mm(17.30), h: mm(7.00),  clt: mm(0.6) },\n  { name: 'hdmi_x14',     c: mm(-15.79), w: mm(15.00), h: mm(6.28),  clt: mm(0.6) },\n  { name: 'usbc_x8',      c: mm(1.01),   w: mm(8.92),  h: mm(3.27),  clt: mm(0.6) },\n  { name: 'usb_stack_x9', c: mm(18.40),  w: mm(14.30), h: mm(16.12), clt: mm(0.4) },\n  { name: 'rj45_x2',      c: mm(35.80),  w: mm(15.74), h: mm(13.80), clt: mm(0.6) }\n];\nconst panel = new THREE.Shape();\npanel.moveTo(-GAP, FLOOR); panel.lineTo(GAP, FLOOR);\npanel.lineTo(GAP, WALL_TOP); panel.lineTo(-GAP, WALL_TOP); panel.closePath();\nports.forEach(p => {\n  const b = PCB_TOP - CL, t = PCB_TOP + p.h + p.clt;\n  panel.holes.push(rrPath(p.w + 2 * CL, t - b, mm(0.8), p.c, (b + t) / 2));\n});\nconst pg = new THREE.ExtrudeGeometry(panel, { depth: TR, bevelEnabled: false, curveSegments: 10 });\nconst pm = new THREE.Mesh(pg, mats.shell);\npm.name = 'io_panel_rear'; pm.position.z = D / 2 - TR; body.add(pm);\n\n/* ---- corner posts: shell part. M3 from the base plate, magnet in the top ---- */\nCORNERS.forEach(([sx, sz], i) => {\n  const x = sx * PX, z = sz * PZ;\n  const shaft = prism(body, `corner_post_${i + 1}`, mats.shell, ring(mm(4), mm(1.4)),\n                      mm(30) - FLOOR, FLOOR);\n  shaft.position.set(x, FLOOR, z);\n  const well = prism(body, `corner_post_well_${i + 1}`, mats.shell, ring(mm(4), MAG_R), MAG_H, mm(30));\n  well.position.set(x, mm(30), z);\n\n  const m = new THREE.Mesh(new THREE.CylinderGeometry(MAG_R - mm(0.1), MAG_R - mm(0.1), MAG_H, 32), mats.mag);\n  m.name = `magnet_shell_${i + 1}`; m.position.set(x, mm(31), z); body.add(m);\n\n  const head = new THREE.Mesh(new THREE.CylinderGeometry(mm(3), mm(3), mm(1.4), 28), mats.mag);\n  head.name = `screw_m3_base_${i + 1}`; head.position.set(x, mm(0.75), z); body.add(head);\n});\n\n/* ---- cover: plate floating 3.5 mm over the wall on four posts ---- */\nCORNERS.forEach(([sx, sz], i) => {\n  const x = sx * PX, z = sz * PZ;\n  const well = prism(body, `top_post_${i + 1}`, mats.cover, ring(mm(4), MAG_R), MAG_H, WALL_TOP);\n  well.position.set(x, WALL_TOP, z);\n  const solid = new THREE.Mesh(\n    new THREE.CylinderGeometry(mm(4), mm(4), TOP_Y - (WALL_TOP + MAG_H), 40), mats.cover);\n  solid.name = `top_post_head_${i + 1}`;\n  solid.position.set(x, (WALL_TOP + MAG_H + TOP_Y) / 2, z);\n  body.add(solid);\n\n  const m = new THREE.Mesh(new THREE.CylinderGeometry(MAG_R - mm(0.1), MAG_R - mm(0.1), MAG_H, 32), mats.mag);\n  m.name = `magnet_cap_${i + 1}`; m.position.set(x, WALL_TOP + MAG_H / 2, z); body.add(m);\n});\nprism(body, 'top_plate', mats.cover, rrShape(W, D, R), TOP_T, TOP_Y);\n\n/* ---- base plate: four layers give real counterbores, blind pockets and engraved text ---- */\nconst MNTX = mm(42), MNTZ = mm(22);\nconst circle = (x, z, r) => { const p = new THREE.Path(); p.absarc(x, -z, r, 0, Math.PI * 2, true); return p; };\n\n/* stick-font strokes, mirrored in x so the text reads the right way up from below */\nfunction stroke(x1, y1, x2, y2, w) {\n  const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy);\n  const nx = -dy / L * w / 2, ny = dx / L * w / 2;\n  const p = new THREE.Path();\n  p.moveTo(-(x1 + nx), y1 + ny); p.lineTo(-(x2 + nx), y2 + ny);\n  p.lineTo(-(x2 - nx), y2 - ny); p.lineTo(-(x1 - nx), y1 - ny);\n  p.closePath(); return p;\n}\nconst GLYPH = {\n  R: [[0,0,0,6],[0,6,2.6,6],[0,3.4,2.6,3.4],[2.6,3.4,2.6,6],[0.6,3.4,2.8,0]],\n  E: [[0,0,0,6],[0,6,2.8,6],[0,3.2,2.4,3.2],[0,0,2.8,0]],\n  V: [[0,6,1.5,0],[1.5,0,3,6]],\n  D: [[0,0,0,6],[0,6,2.2,6],[0,0,2.2,0],[2.6,0.6,2.6,5.4],[2.2,6,2.6,5.4],[2.2,0,2.6,0.6]]\n};\nfunction engrave(text, cx, cy, pitch = 4.6, sw = 0.9) {\n  const out = [];\n  let x = cx - (text.length * pitch - pitch + 3) / 2;\n  for (const ch of text) {\n    (GLYPH[ch] || []).forEach(([x1, y1, x2, y2]) =>\n      out.push(stroke(mm(x + x1), mm(cy + y1), mm(x + x2), mm(cy + y2), mm(sw))));\n    x += pitch;\n  }\n  return out;\n}\nconst REV_TEXT = engrave('REV D', 0, 22);\n\nconst layer = (name, h, y, screwR, pocket, extra = []) => {\n  const holes = extra.slice();\n  CORNERS.forEach(([sx, sz]) => {\n    holes.push(circle(sx * PX, sz * PZ, screwR));\n    if (pocket) holes.push(circle(sx * MNTX, sz * MNTZ, mm(5.2)));\n  });\n  prism(body, name, mats.base, rrShape(W, D, R), h, y, holes);\n};\nlayer('base_plate_lower', mm(1.5), 0,       mm(3.1), true);\nlayer('base_plate_mid',   mm(0.5), mm(1.5), mm(1.7), true);\nlayer('base_plate_upper', mm(0.5), mm(2),   mm(1.7), false);\n\n/* four standoffs at the board's own Ø3.2 holes, M3 from above. The rear pair is Ø6\n   so it stays clear of the rear panel 3 mm behind it */\nCORNERS.forEach(([sx, sz], i) => {\n  const p = prism(body, `board_standoff_${i + 1}`, mats.base,\n                  ring(sz > 0 ? mm(3) : mm(3.5), mm(1.4)), STANDOFF, FLOOR);\n  p.position.set(sx * HX, FLOOR, BZ + sz * HZ);\n});\n\n/* ---- reference board ---- */\nprism(ref, 'pcb', mats.pcb, rrShape(PCB_W, PCB_D, mm(3)), PCB_T, PCB_Y).position.z = BZ;\nconst OVER = { power_x5: mm(2.5), hdmi_x14: mm(1), usbc_x8: mm(1.5), usb_stack_x9: 0, rj45_x2: mm(2.5) };\nports.forEach(p => {\n  const d = mm(16), o = OVER[p.name];\n  box(ref, `conn_${p.name}`, p.name === 'power_x5' ? mats.pcb : mats.metal,\n      p.w, p.h, d, p.c, PCB_TOP, BZ + PCB_D / 2 + o - d / 2);\n});\nbox(ref, 'sodimm_socket_x1', mats.shell, mm(82), mm(4), mm(7), 0, PCB_TOP, BZ + mm(4));\nbox(ref, 'verdin_som', mats.pcb, mm(69.6), mm(1.4), mm(45), 0, PCB_TOP + mm(6), BZ + mm(-4));\nbox(ref, 'heatsink',   mats.metal, mm(64), mm(10), mm(40), 0, PCB_TOP + mm(7.4), BZ + mm(-4));\n\n/* centre on origin, rest on y = 0 */\nconst bb = new THREE.Box3().setFromObject(root);\nroot.position.set(-(bb.min.x + bb.max.x) / 2, -bb.min.y, -(bb.min.z + bb.max.z) / 2);\n\n/* ---- printable parts: each one exports on its own ---- */\nconst PARTS = {\n  base:  { label: 'Base plate',  match: n => /^(base_plate|board_standoff)/.test(n) },\n  shell: { label: 'Shell',       match: n => /^(wall_|io_|corner_post)/.test(n) && n !== (blankFront ? 'wall_front' : 'wall_front_blank') },\n  cap:   { label: 'Top cover',   match: n => /^(top_plate|top_post)/.test(n) }\n};\nconst isCap = n => /^(top_plate|top_post|magnet_cap)/.test(n);\nlet blankFront = false;\nconst EXPLODE = mm(34);\nconst LIFT = { cap: mm(70), shell: mm(44), board: mm(16) };\nlet exploded = false;\nconst pool = [];\nbody.children.slice().forEach(m => { m.userData.y0 = m.position.y; pool.push(m); });\n\nfunction applyExplode() {\n  pool.forEach(m => {\n    let d = 0;\n    if (exploded) {\n      if (isCap(m.name)) d = LIFT.cap;\n      else if (/^(wall_|io_|corner_post|magnet_shell|screw_m3_base)/.test(m.name)) d = LIFT.shell;\n    }\n    m.position.y = m.userData.y0 + d;\n  });\n  ref.position.y = exploded ? LIFT.board : 0;\n}\n\nfunction show(which) {\n  const g = new THREE.Group();\n  g.name = which === 'all' ? 'mallow_enclosure_assembly' : `mallow_${which}`;\n  const inner = new THREE.Group();\n  inner.name = 'part';\n  pool.forEach(m => {\n    if (m.name === 'wall_front') m.visible = !blankFront;\n    if (m.name === 'wall_front_blank') m.visible = blankFront;\n    if (which === 'all' || PARTS[which].match(m.name)) inner.add(m);\n  });\n  if (which === 'all') inner.add(ref);\n  applyExplode();\n  g.add(inner);\n  const b = new THREE.Box3().setFromObject(g);\n  inner.position.set(-(b.min.x + b.max.x) / 2, -b.min.y, -(b.min.z + b.max.z) / 2);\n  stage.setObject(g);\n  document.querySelectorAll('.parts button[data-part]').forEach(el => {\n    const on = el.dataset.part === which;\n    el.style.background = on ? '#3a4048' : '#fff';\n    el.style.color = on ? '#fff' : '#3a4048';\n  });\n}\nlet current = 'all';\ndocument.querySelectorAll('.parts button[data-part]').forEach(el =>\n  el.addEventListener('click', () => { current = el.dataset.part; show(current); }));\nconst xbtn = document.getElementById('explode');\nxbtn.addEventListener('click', () => {\n  exploded = !exploded;\n  xbtn.textContent = exploded ? 'Close it up' : 'Explode';\n  show(current);\n});\nconst fbtn = document.getElementById('frontface');\nfbtn.addEventListener('click', () => {\n  blankFront = !blankFront;\n  fbtn.textContent = blankFront ? 'Front with windows' : 'Blank front';\n  show(current);\n});\nshow('all');\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
