    // document mints the blobs for its OWN frames, obtaining page text

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.

      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);

      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

        s.removeAttribute('src');

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html lang=\"en\"><head>\n<meta charset=\"utf-8\">\n<title>Mallow enclosure rev D — drawings<\u002Ftitle>\n<style>\n  doc-page:not(:defined){visibility:hidden}\n  body{font-family:ui-sans-serif,system-ui,\"Helvetica Neue\",sans-serif;color:#23262a}\n  .page{padding:11mm 12mm;box-sizing:border-box;display:flex;flex-direction:column}\n  .head{display:flex;justify-content:space-between;align-items:baseline;\n        border-bottom:.5pt solid #c9c2b4;padding-bottom:3mm;margin-bottom:4mm}\n  .head h1{font-size:13pt;margin:0;letter-spacing:-.01em}\n  .head .meta{font-size:8pt;color:#6a7079;text-align:right;line-height:1.4}\n  .grid{display:flex;gap:6mm;align-items:flex-start;flex-wrap:nowrap}\n  .col{display:flex;flex-direction:column;gap:5mm}\n  .vt{font-size:7.5pt;text-transform:uppercase;letter-spacing:.07em;color:#6a7079;margin:0 0 1mm}\n  svg{display:block;overflow:visible}\n  .out{fill:none;stroke:#23262a;stroke-width:.35}\n  .in{fill:none;stroke:#23262a;stroke-width:.25}\n  .hid{fill:none;stroke:#9aa0a6;stroke-width:.2;stroke-dasharray:2 1.2}\n  .ctr{fill:none;stroke:#b9a24a;stroke-width:.15;stroke-dasharray:4 1 1 1}\n  .fill{fill:#e8e4dc;stroke:#23262a;stroke-width:.3}\n  .dim{fill:none;stroke:#4a6fa5;stroke-width:.16}\n  .dt{fill:#2f4f7d;font-size:3.4px;font-family:ui-sans-serif,system-ui,sans-serif}\n  .lbl{fill:#23262a;font-size:3.5px;font-family:ui-sans-serif,system-ui,sans-serif}\n  .note{font-size:7.5pt;color:#6a7079;line-height:1.45;margin:3mm 0 0}\n  table{border-collapse:collapse;font-size:7.5pt;margin-top:2mm}\n  th,td{text-align:left;padding:1mm 3mm 1mm 0;border-bottom:.4pt solid #eae5da;white-space:nowrap}\n  th{color:#6a7079;font-size:7pt;text-transform:uppercase;letter-spacing:.06em}\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n\n<doc-page size=\"a4\" orientation=\"landscape\">\n  <section class=\"page\" id=\"p1\">\n    <div class=\"head\">\n      <h1>Shell — plan and rear elevation<\u002Fh1>\n      <div class=\"meta\">Mallow enclosure rev D · 0.65:1 at A4 · dimensions govern · mm<br>PETG, 2.5 mm wall unless noted<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"col\"><p class=\"vt\">Plan, seen from above (rear at top)<\u002Fp><div id=\"v-plan\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"col\">\n        <p class=\"vt\">Rear elevation, from outside<\u002Fp><div id=\"v-rear\"><\u002Fdiv>\n        <p class=\"vt\">Section A–A through a corner post, true scale<\u002Fp><div id=\"v-sec\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\">Heights on the shell are measured from its own bottom face, which sits on the base plate. Cavity 114 × 74 mm with a 4 mm inner corner radius; the board pocket shown dashed is 100 × 72 with the rear edge 0.3 mm off the panel.<\u002Fp>\n  <\u002Fsection>\n\n  <section class=\"page\" id=\"p2\">\n    <div class=\"head\">\n      <h1>Shell — front elevation and openings<\u002Fh1>\n      <div class=\"meta\">Mallow enclosure rev D · 0.65:1 at A4 · dimensions govern · mm<br>All openings include clearance<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"col\"><p class=\"vt\">Front elevation, from outside<\u002Fp><div id=\"v-front\"><\u002Fdiv>\n        <p class=\"vt\">Rear openings — cut sizes<\u002Fp><div id=\"t-ports\"><\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" id=\"p3\">\n    <div class=\"head\">\n      <h1>Base plate<\u002Fh1>\n      <div class=\"meta\">Mallow enclosure rev D · 0.65:1 at A4 · dimensions govern · mm<br>PETG, 2.5 mm plate<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"col\"><p class=\"vt\">Plan, seen from above (rear at top)<\u002Fp><div id=\"v-base\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"col\">\n        <p class=\"vt\">Section B–B, true scale<\u002Fp><div id=\"v-basesec\"><\u002Fdiv>\n        <p class=\"vt\">Underside features<\u002Fp><div id=\"t-base\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section class=\"page\" id=\"p4\">\n    <div class=\"head\">\n      <h1>Top cover<\u002Fh1>\n      <div class=\"meta\">Mallow enclosure rev D · 0.65:1 at A4 · dimensions govern · mm<br>PETG, 2.5 mm plate + four posts<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"grid\">\n      <div class=\"col\"><p class=\"vt\">Underside, seen from below (rear at top)<\u002Fp><div id=\"v-cover\"><\u002Fdiv><\u002Fdiv>\n      <div class=\"col\">\n        <p class=\"vt\">Section C–C through two posts, true scale<\u002Fp><div id=\"v-coversec\"><\u002Fdiv>\n        <p class=\"note\" style=\"max-width:80mm\">The cover carries no fasteners. It rests on the four post faces and is held by four 5 × 2 mm magnets glued into the pockets, meeting their pairs in the shell posts. Set the polarity by test before the glue sets.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<script src=\"e43bdddf-6305-49cc-b82e-333da6087406\"><\u002Fscript>\n<\u002Fdoc-page>\n<script>\n/* ---- every number below is the rev D model ---- */\nconst W = 119, D = 78, R = 6.5, T = 2.5, TR = 1.5;\nconst FLOOR = 2.5, STANDOFF = 10, PCB_T = 1.6;\nconst PCB_Y = FLOOR + STANDOFF, PCB_TOP = PCB_Y + PCB_T;\nconst WALL_TOP = 32, TOP_T = 2.5, SLOT = 3.5;\nconst SH = WALL_TOP - FLOOR;                    /* shell height, part local */\nconst IX = W / 2 - T, IZ = D / 2 - T, RI = R - T;\nconst PX = 54.75, PZ = 32, GAP = 51;\nconst BZ = 1.2, HX = 47, HZ = 33, PCB_W = 100, PCB_D = 72;\nconst MNTX = 42, MNTZ = 22, MAG_D = 5.2, MAG_H = 2;\nconst CL = 0.6;\nconst ports = [\n  ['Power X5', -35.29, 17.30, 7.00, 0.6],\n  ['HDMI X14', -15.79, 15.00, 6.28, 0.6],\n  ['USB-C X8', 1.01, 8.92, 3.27, 0.6],\n  ['USB-A stack X9', 18.40, 14.30, 16.12, 0.4],\n  ['RJ45 X2', 35.80, 15.74, 13.80, 0.6]\n];\nconst SWX = [-41, -27], LEDX = [-36, -32];\n\nconst N = v => (Math.round(v * 100) / 100).toString();\nlet out = '';\nconst el = s => `<g>${s}<\u002Fg>`;\nfunction rr(x, y, w, h, r, cls) {\n  return `<rect class=\"${cls}\" x=\"${N(x)}\" y=\"${N(y)}\" width=\"${N(w)}\" height=\"${N(h)}\" rx=\"${N(r)}\" ry=\"${N(r)}\"/>`;\n}\nconst ln = (x1, y1, x2, y2, cls) =>\n  `<line class=\"${cls}\" x1=\"${N(x1)}\" y1=\"${N(y1)}\" x2=\"${N(x2)}\" y2=\"${N(y2)}\"/>`;\nconst ci = (cx, cy, d, cls) => `<circle class=\"${cls}\" cx=\"${N(cx)}\" cy=\"${N(cy)}\" r=\"${N(d / 2)}\"/>`;\nconst tx = (x, y, s, cls = 'dt', anchor = 'middle') =>\n  `<text class=\"${cls}\" x=\"${N(x)}\" y=\"${N(y)}\" text-anchor=\"${anchor}\">${s}<\u002Ftext>`;\nfunction tick(x, y, dx, dy) { return ln(x - dx, y - dy, x + dx, y + dy, 'dim'); }\n/* horizontal dimension between x1 and x2, dim line at y, features at fy */\nfunction dimH(x1, x2, y, fy, label) {\n  let s = ln(x1, fy, x1, y + (y > fy ? 1.6 : -1.6), 'dim') + ln(x2, fy, x2, y + (y > fy ? 1.6 : -1.6), 'dim');\n  s += ln(x1, y, x2, y, 'dim') + tick(x1, y, 0, 1) + tick(x2, y, 0, 1);\n  s += tx((x1 + x2) / 2, y - 1.1, label ?? N(Math.abs(x2 - x1)));\n  return s;\n}\nfunction dimV(y1, y2, x, fx, label) {\n  let s = ln(fx, y1, x + (x > fx ? 1.6 : -1.6), y1, 'dim') + ln(fx, y2, x + (x > fx ? 1.6 : -1.6), y2, 'dim');\n  s += ln(x, y1, x, y2, 'dim') + tick(x, y1, 1, 0) + tick(x, y2, 1, 0);\n  s += `<text class=\"dt\" x=\"${N(x - 1.1)}\" y=\"${N((y1 + y2) / 2)}\" text-anchor=\"middle\" transform=\"rotate(-90 ${N(x - 1.1)} ${N((y1 + y2) / 2)})\">${label ?? N(Math.abs(y2 - y1))}<\u002Ftext>`;\n  return s;\n}\nconst leader = (x, y, tox, toy, label) =>\n  ln(x, y, tox, toy, 'dim') + tx(tox + (tox > x ? 1 : -1), toy + 0.9, label, 'dt', tox > x ? 'start' : 'end');\n\nconst F = 0.65;                                 /* fit the views onto A4 landscape */\nfunction view(id, w, h, pad, inner) {\n  document.getElementById(id).innerHTML =\n    `<svg viewBox=\"${N(-w / 2 - pad)} ${N(-h / 2 - pad)} ${N(w + 2 * pad)} ${N(h + 2 * pad)}\" style=\"width:${N((w + 2 * pad) * F)}mm\">${inner}<\u002Fsvg>`;\n}\n\n/* ============ shell plan ============ */\n{\n  let s = rr(-W / 2, -D / 2, W, D, R, 'out');\n  /* cavity: rear inner face 1.5 in, others 2.5 */\n  s += `<path class=\"in\" d=\"M ${N(-IX)} ${N(-(D / 2 - TR))} L ${N(IX)} ${N(-(D / 2 - TR))} L ${N(IX)} ${N(IZ - RI)} A ${N(RI)} ${N(RI)} 0 0 1 ${N(IX - RI)} ${N(IZ)} L ${N(-IX + RI)} ${N(IZ)} A ${N(RI)} ${N(RI)} 0 0 1 ${N(-IX)} ${N(IZ - RI)} Z\"/>`;\n  /* board pocket, dashed: rear edge 0.3 off the panel */\n  const bz0 = -(D / 2 - TR - 0.3), bz1 = bz0 + PCB_D;\n  s += rr(-PCB_W / 2, bz0, PCB_W, PCB_D, 4, 'hid');\n  /* corner posts */\n  [-1, 1].forEach(sx => [-1, 1].forEach(sz => {\n    s += ci(sx * PX, -sz * PZ, 8, 'fill') + ci(sx * PX, -sz * PZ, 2.8, 'in');\n    s += ln(sx * PX - 5.5, -sz * PZ, sx * PX + 5.5, -sz * PZ, 'ctr');\n    s += ln(sx * PX, -sz * PZ - 5.5, sx * PX, -sz * PZ + 5.5, 'ctr');\n  }));\n  s += dimH(-W / 2, W / 2, -D / 2 - 14, -D / 2, N(W));\n  s += dimH(-PX, PX, -D / 2 - 8, -PZ, N(PX * 2));\n  s += dimV(-D / 2, D / 2, -W / 2 - 14, -W / 2, N(D));\n  s += dimV(-PZ, PZ, -W / 2 - 8, -PX, N(PZ * 2));\n  s += dimV(bz0, bz1, W / 2 + 8, PCB_W / 2, N(PCB_D));\n  s += dimH(-PCB_W / 2, PCB_W / 2, D / 2 + 8, D / 2, N(PCB_W));\n  s += leader(PX + 4, -PZ - 4, PX + 13, -PZ - 11, 'Ø8, bore Ø2.8');\n  s += leader(-W / 2 + 1.9, -D / 2 + 1.9, -W / 2 - 11, -D / 2 - 7, 'R6.5');\n  s += leader(-IX, 0, -IX - 9, 6, 'wall 2.5');\n  s += leader(0, -(D / 2 - TR / 2), 8, -D / 2 - 7, 'rear panel 1.5');\n  view('v-plan', W, D, 17, s);\n}\n\n/* ============ shell rear elevation ============ */\n{\n  const h = SH;\n  let s = rr(-W / 2, -h / 2, W, h, 0, 'out');\n  s += ln(-W / 2, h / 2 - (PCB_Y - FLOOR), W / 2, h / 2 - (PCB_Y - FLOOR), 'hid');\n  ports.forEach(([, c, w, ph, clt]) => {\n    const b = (PCB_TOP - CL) - FLOOR, t = (PCB_TOP + ph + clt) - FLOOR;\n    s += rr(c - w / 2 - CL, h / 2 - t, w + 2 * CL, t - b, 0.8, 'in');\n  });\n  s += dimH(-W / 2, W / 2, -h / 2 - 16, -h / 2, N(W));\n  let y = -h / 2 - 4;\n  ports.forEach(([, c, w], i) => {\n    s += dimH(-W / 2, c, y - (i % 3) * 5, h / 2 - ((PCB_TOP + 3) - FLOOR), N(c + W / 2));\n  });\n  ports.forEach(([, c, w, ph, clt]) => {\n    const t = (PCB_TOP + ph + clt) - FLOOR, b = (PCB_TOP - CL) - FLOOR;\n    s += dimH(c - w / 2 - CL, c + w / 2 + CL, h / 2 - t - 3, h / 2 - t, N(w + 2 * CL));\n  });\n  s += dimV(h / 2 - ((PCB_TOP - CL) - FLOOR), h / 2, W / 2 + 6, W / 2, N((PCB_TOP - CL) - FLOOR));\n  s += dimV(-h / 2, h / 2, W / 2 + 14, W / 2, N(h));\n  s += tx(0, h / 2 + 9, \"centres measured from the box's left edge\", 'lbl');\n  view('v-rear', W, SH, 20, s);\n}\n\n/* ============ shell section through a corner post, true scale ============ */\n{\n  const h = SH, x0 = 46, x1 = W / 2;            /* real x range shown */\n  const w = x1 - x0, L = v => v - (x0 + x1) / 2; /* world x -> local */\n  const P = p => h / 2 - p;                      /* part height -> local y */\n  let s = '';\n  s += rr(L(IX), -h / 2, T, h, 0, 'fill');                       /* wall */\n  s += rr(L(PX - 4), -h / 2, 8, h, 0, 'fill');                    /* post, fused to the wall */\n  s += rr(L(PX - 1.4), P(27.5), 2.8, 27.5, 0, 'in');              /* M3 bore, open at the bottom */\n  s += rr(L(PX - MAG_D / 2), P(SH), MAG_D, MAG_H, 0, 'in');       /* magnet pocket in the top */\n  s += dimV(-h / 2, h / 2, L(x1) + 7, L(x1), N(h));\n  s += dimV(P(SH), P(SH - MAG_H), L(x0) - 5, L(PX - MAG_D / 2), N(MAG_H));\n  s += dimH(L(PX - 4), L(PX + 4), P(SH) - 7, P(SH), 'Ø8');\n  s += leader(L(PX), P(14), L(x0) - 3, P(20), 'bore Ø2.8, open at the bottom');\n  s += leader(L(IX + T / 2), P(8), L(x1) + 3, P(4), 'wall 2.5');\n  s += leader(L(PX), P(SH) + 1, L(x1) + 3, P(SH) - 4, 'Ø5.2 × 2 pocket');\n  view('v-sec', w, SH, 30, s);\n}\n\n/* ============ shell front elevation ============ */\n{\n  const h = SH;\n  let s = rr(-W / 2, -h / 2, W, h, 0, 'out');\n  s += ln(-W / 2, h / 2 - (PCB_Y - FLOOR), W / 2, h / 2 - (PCB_Y - FLOOR), 'hid');\n  /* front seen from outside: x mirrored */\n  SWX.forEach(x => { s += ci(-x, h / 2 - (PCB_TOP + 1.65 - FLOOR), 4, 'in'); });\n  LEDX.forEach(x => { s += ci(-x, h / 2 - (PCB_TOP + 0.85 - FLOOR), 2, 'in'); });\n  s += dimH(-W / 2, W / 2, -h / 2 - 16, -h / 2, N(W));\n  s += dimV(-h / 2, h / 2, -W / 2 - 8, -W / 2, N(h));\n  s += ln(50, -h / 2 - 2, 50, h / 2 + 4, 'hid');\n  s += tx(50, h / 2 + 7, \"board's right edge\", 'lbl');\n  SWX.concat(LEDX).forEach((x, i) => {\n    const rx = -x, fy = h / 2 - ((i < 2 ? PCB_TOP + 1.65 : PCB_TOP + 0.85) - FLOOR);\n    s += dimH(50, rx, -h / 2 - 4 - (i % 2) * 4, fy, N(50 - rx));\n  });\n  s += dimV(h / 2 - (PCB_TOP + 1.65 - FLOOR), h / 2, W / 2 + 6, W / 2, N(PCB_TOP + 1.65 - FLOOR));\n  s += leader(-SWX[0], h / 2 - (PCB_TOP + 1.65 - FLOOR) - 2, -SWX[0] - 10, -h / 2 + 6, 'Ø4 switch');\n  s += leader(-LEDX[0], h / 2 - (PCB_TOP + 0.85 - FLOOR) - 1, -LEDX[0] + 10, -h / 2 + 10, 'Ø2 LED');\n  view('v-front', W, SH, 22, s);\n}\n\n/* ============ base plate plan ============ */\n{\n  let s = rr(-W / 2, -D / 2, W, D, R, 'out');\n  [-1, 1].forEach(sx => {\n    /* rear standoff Ø6, front standoff Ø7 */\n    s += ci(sx * HX, -(BZ + HZ), 6, 'fill') + ci(sx * HX, -(BZ + HZ), 2.8, 'in');\n    s += ci(sx * HX, -(BZ - HZ), 7, 'fill') + ci(sx * HX, -(BZ - HZ), 2.8, 'in');\n    [-1, 1].forEach(sz => {\n      s += ci(sx * PX, -sz * PZ, 3.4, 'in') + ci(sx * PX, -sz * PZ, 6.2, 'hid');\n      s += ci(sx * MNTX, -sz * MNTZ, 10.4, 'hid');\n    });\n  });\n  s += dimH(-W / 2, W / 2, -D / 2 - 14, -D / 2, N(W));\n  s += dimV(-D / 2, D / 2, -W / 2 - 14, -W / 2, N(D));\n  s += dimH(-HX, HX, -D / 2 - 8, -(BZ + HZ), N(HX * 2));\n  s += dimV(-(BZ + HZ), -(BZ - HZ), -W / 2 - 8, -HX, N(HZ * 2));\n  s += dimH(-PX, PX, D / 2 + 8, PZ, N(PX * 2));\n  s += dimV(-PZ, PZ, W / 2 + 8, PX, N(PZ * 2));\n  s += dimH(-MNTX, MNTX, D / 2 + 14, MNTZ, N(MNTX * 2));\n  s += dimV(-MNTZ, MNTZ, W / 2 + 14, MNTX, N(MNTZ * 2));\n  s += leader(HX + 3, -(BZ + HZ) - 1, HX - 2, -(BZ + HZ) + 13, 'Ø6 standoff, bore Ø2.8');\n  s += leader(-HX - 3.5, -(BZ - HZ), -HX + 12, -(BZ - HZ) - 4, 'Ø7 standoff, bore Ø2.8');\n  s += leader(PX, PZ + 3.2, PX - 14, PZ - 8, 'Ø3.4 through, Ø6.2 c-bore 1.5 deep');\n  s += leader(-MNTX, MNTZ + 5.2, -MNTX + 2, MNTZ - 12, 'Ø10.4 pocket, 2 deep');\n  view('v-base', W, D, 19, s);\n}\n\n/* ============ base plate section, true scale ============ */\n{\n  const h = FLOOR + STANDOFF, P = p => h / 2 - p;\n  let s = rr(-W / 2, P(FLOOR), W, FLOOR, 0, 'fill');\n  [-1, 1].forEach(sx => {\n    const d = sx < 0 ? 7 : 6;\n    s += rr(sx * HX - d / 2, P(h), d, STANDOFF, 0, 'fill');\n    s += rr(sx * HX - 1.4, P(h), 2.8, STANDOFF, 0, 'in');\n    s += rr(sx * PX - 1.7, P(FLOOR), 3.4, FLOOR, 0, 'in');\n    s += rr(sx * PX - 3.1, P(1.5), 6.2, 1.5, 0, 'in');\n    s += rr(sx * MNTX - 10.4 / 2, P(2), 10.4, 2, 0, 'in');\n  });\n  s += dimV(P(h), P(0), -W / 2 - 7, -HX, N(h));\n  s += dimV(P(FLOOR), P(0), W / 2 + 7, W / 2, N(FLOOR));\n  s += leader(-HX, P(h) + 3, -HX - 16, P(h) - 5, 'Ø7 standoff, front pair');\n  s += leader(HX, P(h) + 3, HX + 14, P(h) - 5, 'Ø6 standoff, rear pair');\n  s += leader(-MNTX, P(1), -MNTX - 8, P(0) + 7, 'Ø10.4 × 2, open at the underside');\n  s += leader(PX, P(0.7), PX + 6, P(0) + 7, 'Ø6.2 c-bore 1.5 deep');\n  s += tx(0, P(h) - 12, 'standoff tops are the board underside, 12.5 above the base', 'lbl');\n  view('v-basesec', W, FLOOR + STANDOFF, 24, s);\n}\n\n/* ============ cover underside ============ */\n{\n  let s = rr(-W / 2, -D / 2, W, D, R, 'out');\n  [-1, 1].forEach(sx => [-1, 1].forEach(sz => {\n    s += ci(sx * PX, -sz * PZ, 8, 'fill') + ci(sx * PX, -sz * PZ, MAG_D, 'in');\n  }));\n  s += dimH(-W / 2, W / 2, -D / 2 - 14, -D / 2, N(W));\n  s += dimV(-D / 2, D / 2, -W / 2 - 14, -W / 2, N(D));\n  s += dimH(-PX, PX, -D / 2 - 8, -PZ, N(PX * 2));\n  s += dimV(-PZ, PZ, -W / 2 - 8, -PX, N(PZ * 2));\n  s += leader(PX + 4, PZ + 4, PX + 12, PZ + 12, 'post Ø8, pocket Ø5.2 × 2');\n  s += leader(-W / 2 + 1.9, D / 2 - 1.9, -W / 2 - 10, D / 2 + 7, 'R6.5');\n  view('v-cover', W, D, 18, s);\n}\n\n/* ============ cover section, true scale ============ */\n{\n  const h = TOP_T + SLOT, P = p => -h / 2 + p;   /* p measured down from the cover's outer face */\n  let s = rr(-W / 2, P(0), W, TOP_T, 0, 'fill');\n  [-1, 1].forEach(sx => {\n    s += rr(sx * PX - 4, P(TOP_T), 8, SLOT, 0, 'fill');\n    s += rr(sx * PX - MAG_D / 2, P(h - MAG_H), MAG_D, MAG_H, 0, 'in');\n  });\n  s += dimV(P(0), P(h), -W / 2 - 7, -PX, N(h));\n  s += dimV(P(0), P(TOP_T), W / 2 + 7, W / 2, N(TOP_T));\n  s += dimV(P(h - MAG_H), P(h), W / 2 + 14, PX, N(MAG_H));\n  s += dimH(-PX, PX, P(h) + 8, P(h), N(PX * 2));\n  s += leader(-PX, P(h) - 1, -PX - 14, P(h) + 5, 'magnet face, meets the shell post');\n  s += leader(0, P(1.2), 10, P(0) - 5, 'plate 2.5');\n  s += tx(0, P(h) + 14, 'posts stand 3.5 clear of the plate — this is the shadow gap', 'lbl');\n  view('v-coversec', W, TOP_T + SLOT, 24, s);\n}\n\n/* ============ tables ============ */\n{\n  let r = '<table><thead><tr><th>Opening<\u002Fth><th>Centre x from box centre<\u002Fth><th>Cut width<\u002Fth><th>Cut height above shell floor<\u002Fth><\u002Ftr><\u002Fthead><tbody>';\n  ports.forEach(([n, c, w, ph, clt]) => {\n    const b = (PCB_TOP - CL) - FLOOR, t = (PCB_TOP + ph + clt) - FLOOR;\n    r += `<tr><td>${n}<\u002Ftd><td>${N(c)}<\u002Ftd><td>${N(w + 2 * CL)}<\u002Ftd><td>${N(b)} to ${N(t)}<\u002Ftd><\u002Ftr>`;\n  });\n  r += '<\u002Ftbody><\u002Ftable>';\n  document.getElementById('t-ports').innerHTML = r;\n\n  document.getElementById('t-base').innerHTML =\n    '<table><thead><tr><th>Feature<\u002Fth><th>Size<\u002Fth><th>Depth<\u002Fth><\u002Ftr><\u002Fthead><tbody>' +\n    '<tr><td>Screw counterbore<\u002Ftd><td>Ø6.2<\u002Ftd><td>1.5 from underside<\u002Ftd><\u002Ftr>' +\n    '<tr><td>Screw through hole<\u002Ftd><td>Ø3.4<\u002Ftd><td>full<\u002Ftd><\u002Ftr>' +\n    '<tr><td>Mounting magnet pocket<\u002Ftd><td>Ø10.4<\u002Ftd><td>2.0 from underside<\u002Ftd><\u002Ftr>' +\n    '<tr><td>Standoff bores<\u002Ftd><td>Ø2.8<\u002Ftd><td>full<\u002Ftd><\u002Ftr>' +\n    '<\u002Ftbody><\u002Ftable>';\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
